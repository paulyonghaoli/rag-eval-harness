llm_as_judge:
  enabled: false
  openai_api_key_env: OPENAI_API_KEY
similarity_thresholds:
  faithfulness: 0.7
  precision: 0.5
faithfulness_method: cosine   # cosine | nli  (nli uses CrossEncoder NLI model, more accurate)
nli_model: cross-encoder/nli-deberta-v3-small
clustering:
  min_k: 3
  max_k: 5
embedder_model: all-MiniLM-L6-v2
# quality_gates:             # uncomment to fail CI when any metric mean falls below threshold
