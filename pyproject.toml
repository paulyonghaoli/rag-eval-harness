[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "Production-quality RAG evaluation harness"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.1",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["evaluator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
